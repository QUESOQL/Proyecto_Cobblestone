; Lector de tarjetas de AforoON: ESP32 DevKit (WROOM-32) + PN532 por I2C + anillo WS2812 + buzzer.
; Informe de hardware v4, secciones 5 a 7. Se enlaza por Bluetooth (BLE) con el celular del guardia;
; no usa Wi-Fi ni habla con Supabase.
;
;   pio run                      compilar
;   pio run -t upload            cargar al ESP32 (USB)
;   pio device monitor           monitor serie para aprovisionar (NOMBRE, CLAVE, ESTADO)
;   pio test -e native           pruebas del intérprete NDEF en el computador (necesita gcc)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit PN532@1.3.4
  h2zero/NimBLE-Arduino@2.3.2
  adafruit/Adafruit NeoPixel@1.12.5
build_flags = -DCORE_DEBUG_LEVEL=1
test_ignore = test_ndef

[env:native]
platform = native
build_src_filter = +<ndef.cpp>
test_filter = test_ndef
